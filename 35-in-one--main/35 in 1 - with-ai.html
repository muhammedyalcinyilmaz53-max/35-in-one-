<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-title" content="Çoklu Uygulama">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Çoklu Amaçlı Uygulama — 35 in 1 + Yapay Zeka</title>
    <style>
        /* Basit düzen ve sekme/iframe kapsayıcısı */
        :root{--bg:#f4efe7;--brand:#0f766e}
        html,body{height:100%;margin:0;font-family:Segoe UI, Roboto, Arial, sans-serif;background:linear-gradient(145deg,#f8f5ef, #d9efe8);}
        .shell{height:100%;display:flex;flex-direction:column}
        header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(255,255,255,0.85);border-bottom:1px solid rgba(0,0,0,0.06)}
        header h1{font-size:18px;margin:0;color:#134e4a}
        .controls{margin-left:auto;display:flex;gap:8px}
        .btn{background:var(--brand);color:#fff;border:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700}
        .btn.ghost{background:transparent;color:var(--brand);border:1px solid rgba(15,118,110,0.12)}
        main{flex:1;display:flex;flex-direction:column;padding:14px}
        .view-switch{display:flex;gap:8px;margin-bottom:10px}
        .frame-area{flex:1;background:white;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,0.06);display:flex}
        iframe{border:0;width:100%;height:100%}
        .split{display:flex}
        .split iframe{width:50%}
        /* mobilde alt alta */
        @media (max-width:900px){.split iframe{width:100%;height:50vh}.frame-area{flex-direction:column}}
        /* küçük yardımcı not */
        .note{font-size:12px;color:#3f3f3f;margin-left:12px}
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <h1>Çoklu Amaçlı Uygulama — 35 in 1</h1>
            <div class="note">Yapay Zeka entegrasyonu: uygulama ve AI arayüzünü aynı sayfada görüntüleyin.</div>
            <div class="controls">
                <button class="btn" id="tab-app">Ana Uygulama</button>
                <button class="btn" id="tab-ai">Yapay Zeka</button>
                <button class="btn ghost" id="tab-split">Yan Yana</button>
            </div>
        </header>
        <main>
            <div class="view-switch">
                <small style="color:#555">Not: İframe kaynakları aynı klasördeki dosyalara işaret eder.</small>
            </div>
            <div class="frame-area" id="frameArea">
                <!-- Başlangıçta Ana Uygulama gösterilsin -->
                <iframe id="appFrame" src="35 in 1.html" title="35 in 1 Uygulama"></iframe>
                <!-- AI iframe başlangıçta gizli -->
                <iframe id="aiFrame" src="yapyzeka.html" title="Yapay Zeka" style="display:none"></iframe>
            </div>
        </main>
    </div>

    <script>
        const tabApp = document.getElementById('tab-app');
        const tabAi = document.getElementById('tab-ai');
        const tabSplit = document.getElementById('tab-split');
        const appFrame = document.getElementById('appFrame');
        const aiFrame = document.getElementById('aiFrame');
        const frameArea = document.getElementById('frameArea');

        function showApp(){
            appFrame.style.display='block';
            aiFrame.style.display='none';
            frameArea.classList.remove('split');
        }
        function showAi(){
            appFrame.style.display='none';
            aiFrame.style.display='block';
            frameArea.classList.remove('split');
        }
        function showSplit(){
            appFrame.style.display='block';
            aiFrame.style.display='block';
            frameArea.classList.add('split');
        }

        tabApp.addEventListener('click', showApp);
        tabAi.addEventListener('click', showAi);
        tabSplit.addEventListener('click', showSplit);

        // Varsayılan görünüm: Ana uygulama
        showApp();

        // Güvenlik: parent-iframe iletişimi gerektiğinde, postMessage ile iletişim kurabilirsiniz.
    </script>
</body>
</html>
