<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YapayZeka — Basit Görünüm</title>
  <style>
    :root{--brand:#10a37f}
    body{margin:0;font-family:Segoe UI, Roboto, Arial, sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;align-items:center;justify-content:center}
    .card{width:100%;max-width:1100px;height:90vh;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #eee;background:#fff}
    .back{background:var(--brand);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}
    .title{font-weight:700;color:#222}
    .frame{flex:1;background:#fafafa}
    .frame iframe{width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <button class="back" id="backBtn">Uygulamaya Dön</button>
      <div class="title">Yapay Zeka (basit görünüm)</div>
    </div>
    <div class="frame">
      <!-- Orijinal yapyzeka.html'i burada yüklüyoruz -->
      <iframe src="yapyzeka.html" title="Yapay Zeka Orijinal"></iframe>
    </div>
  </div>

  <script>
    const backBtn = document.getElementById('backBtn');
    backBtn.addEventListener('click', ()=>{
      // Eğer bir parent penceresi varsa, gösterim isteği gönder
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:'showApp'}, '*');
      } else {
        // Bağımsız olarak açılmışsa ana uygulamaya yönlendir
        location.href = '35 in 1.html';
      }
    });
  </script>
</body>
</html>
